<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Primary meta -->
    <title>CodeK — Learn. Explore. Build.</title>
    <meta
      name="description"
      content="CodeK is a coding learning platform with hands-on courses in Web Development, AI, and Cyber Security, plus AI-powered quizzes and personalized feedback."
    />
    <meta
      name="keywords"
      content="CodeK, learn to code, web development, AI courses, cyber security, programming quiz, AI tutor, online coding"
    />
    <meta name="author" content="CodeK Team" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, ...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CodeK" />
    <meta property="og:title" content="CodeK — Learn. Explore. Build." />
    <meta
      property="og:description"
      content="Hands-on courses in Web Development, AI, and Cyber Security with AI-powered quizzes and personalized feedback."
    />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CodeK — Learn. Explore. Build." />
    <meta
      name="twitter:description"
      content="Hands-on courses in Web Development, AI, and Cyber Security with AI-powered quizzes and personalized feedback."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Icons / PWA -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts (matches the Poppins / Cairo stack already in CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app. CodeK is an interactive
      coding learning platform — please enable JavaScript or switch to a
      browser that supports it.
    </noscript>
    <div id="root"></div>
  </body>
</html>
