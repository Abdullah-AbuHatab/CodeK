# Keep-alive for the free hosting stack.
#
# MongoDB Atlas pauses a Free cluster after 30 days without connections, and
# the Render free web service sleeps after 15 minutes idle, so a quiet
# portfolio site would eventually lose its database. Every ~5 days this job
# wakes the Render service and calls /api/health/db, which makes the server
# connect to Atlas and run a real `ping` — enough activity to keep the cluster
# from pausing.
#
# Setup: Settings → Secrets and variables → Actions → Variables → New
# repository variable: APP_URL = https://<your-service>.onrender.com
#
# GitHub disables scheduled workflows in public repositories after 60 days
# without repository activity (commits, etc.). Re-enable it from the Actions
# tab ("Keep-alive" → "Enable workflow") or with:
#   gh workflow enable keepalive.yml
name: Keep-alive

on:
  schedule:
    # 06:17 UTC on days 1, 6, 11, 16, 21, 26 and 31 of every month.
    - cron: "17 6 */5 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping the deep health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Repository variable APP_URL is not set (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          url="${APP_URL%/}/api/health/db"
          body="$RUNNER_TEMP/health.json"

          # A cold Render start takes about a minute, and the server needs a
          # few more seconds to reach Atlas, so retry generously.
          for attempt in 1 2 3 4 5 6; do
            rm -f "$body"
            code=$(curl --silent --show-error --location --max-time 90 \
              --output "$body" --write-out '%{http_code}' "$url" || true)
            echo "Attempt $attempt: HTTP ${code:-none} $(head -c 300 "$body" 2>/dev/null || true)"
            if [ "$code" = "200" ]; then
              echo "Database is reachable."
              exit 0
            fi
            sleep 30
          done

          echo "::error::$url did not return 200 after 6 attempts. Check the Render logs and whether the Atlas cluster is paused."
          exit 1
